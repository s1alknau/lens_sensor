[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-sensor"
version = "0.1.0"
description = "2D/3D-FDTD-Simulation eines Kontaktlinsen-/Wellenleiter-Traenenfilm-Sensors (NumPy/CuPy)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # numpy<2.6 deckt sich mit der neuesten CuPy 13.x -> kein Konflikt beim GPU-Install
    "numpy>=1.22,<2.6",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "imageio>=2.19",
    "scikit-image>=0.19",
    "psutil>=5.9",
]

[project.optional-dependencies]
# GPU: pip zieht die neueste passende CuPy (14.x auf Python >=3.10, sonst 13.x).
# z.B.  pip install ".[gpu-cuda12]"
gpu-cuda12 = ["cupy-cuda12x>=13"]
gpu-cuda11 = ["cupy-cuda11x>=13"]

# Das Projekt ist eine Sammlung direkt ausführbarer Skripte (keine Paket-Importe),
# daher keine automatische Paket-Erkennung — pip installiert nur die Abhängigkeiten.
[tool.setuptools]
py-modules = []
